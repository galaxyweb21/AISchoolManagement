<div class="col-sm-6 col-xl-4">
    <div class="guide-step p-3">
        <div class="d-flex gap-3">
            <div class="guide-number">{{ n }}</div>
            <div class="guide-icon"><i class="bi {{ icon }}"></i></div>
            <div class="flex-grow-1 min-w-0">
                <h6 class="fw-bold mb-1">{{ title }}</h6>
                <p class="text-muted small mb-3">{{ text }}</p>
                <a href="{% url url %}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-arrow-right me-1"></i>{{ label }}
                </a>
            </div>
        </div>
    </div>
</div>

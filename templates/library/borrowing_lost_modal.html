<form method="post" action="{% url action_url borrowing.id %}">
    {% csrf_token %}
    <p class="mb-4 text-center">
        Are you sure you want to mark <strong>"{{ borrowing.book.title }}"</strong> as Lost?<br>
        <span class="text-muted text-danger small">This will permanently mark the book as unavailable.</span>
    </p>
    <div class="d-flex gap-2 justify-content-center border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i> Confirm Lost
        </button>
    </div>
</form>

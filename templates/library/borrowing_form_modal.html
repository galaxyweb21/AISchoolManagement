<style>
    .btn-gold {
        background-color: var(--eduai-gold, #946B1C) !important;
        border-color: var(--eduai-gold, #946B1C) !important;
        color: #fff !important;
    }
    .btn-gold:hover {
        background-color: #7a5917 !important;
        border-color: #7a5917 !important;
        color: #fff !important;
    }
    .text-gold {
        color: var(--eduai-gold, #946B1C) !important;
    }
</style>

<form method="post" action="{% url action_url %}" id="borrowingForm">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label fw-semibold">Select Book <span class="text-danger">*</span></label>
        <select name="book" class="form-select" required>
            <option value="">Select Book</option>
            {% for b in books %}
                <option value="{{ b.id }}">{{ b.title }} by {{ b.author }} ({{ b.available_copies }} left)</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Borrower Type <span class="text-danger">*</span></label>
        <select name="borrower_type" id="borrowerType" class="form-select" required onchange="switchBorrowerDropdown()">
            <option value="">Select Type</option>
            <option value="STUDENT">Student</option>
            <option value="STAFF">Staff</option>
        </select>
    </div>

    <!-- ============================================================ -->
    <!-- TWO SEPARATE DROPDOWNS SHARING name="borrower_id".            -->
    <!-- Only the visible + enabled one is submitted; the hidden one   -->
    <!-- is disabled so browsers exclude it from the POST entirely.    -->
    <!-- No JS option-rebuilding, so nothing can get lost.             -->
    <!-- ============================================================ -->
    <div class="mb-3">
        <label class="form-label fw-semibold" id="borrowerLabel">Select Student <span class="text-danger">*</span></label>

        <select name="borrower_id" id="studentSelect" class="form-select borrower-select" required>
            <option value="">Select Student</option>
            {% for s in students %}
                <option value="{{ s.id }}">{{ s.user.get_full_name }} ({{ s.admission_number }})</option>
            {% endfor %}
        </select>

        <select name="borrower_id" id="staffSelect" class="form-select borrower-select d-none" disabled>
            <option value="">Select Staff</option>
            {% for s in staff_members %}
                <option value="{{ s.id }}">{{ s.user.get_full_name }} ({{ s.staff_id }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-4">
        <label class="form-label fw-semibold">Due Date <span class="text-danger">*</span></label>
        <input type="date" name="due_date" class="form-control" required>
    </div>

    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-gold" id="borrowSubmitBtn">
            <i class="bi bi-plus-circle me-1"></i> Borrow Book
        </button>
    </div>
</form>

<style>
    .btn-gold {
        background-color: var(--eduai-gold, #946B1C) !important;
        border-color: var(--eduai-gold, #946B1C) !important;
        color: #fff !important;
    }
    .btn-gold:hover {
        background-color: #7a5917 !important;
        border-color: #7a5917 !important;
        color: #fff !important;
    }
    .text-gold {
        color: var(--eduai-gold, #946B1C) !important;
    }
</style>

<form method="post" action="{% if mode == 'create' %}{% url action_url %}{% else %}{% url action_url category.id %}{% endif %}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" placeholder="e.g., Science Fiction" value="{% if mode == 'edit' %}{{ category.name }}{% endif %}" required>
    </div>
    <div class="mb-4">
        <label class="form-label fw-semibold">Description <span class="text-muted fw-normal">(optional)</span></label>
        <textarea name="description" class="form-control" rows="3" placeholder="Brief description of the category">{{ category.description|default:'' }}</textarea>
    </div>
    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-gold">
            <i class="bi {% if mode == 'create' %}bi-check2-circle{% else %}bi-pencil-square{% endif %} me-1"></i>
            {% if mode == 'create' %}Add Category{% else %}Save Changes{% endif %}
        </button>
    </div>
</form>

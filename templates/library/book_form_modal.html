<style>
    .btn-gold {
        background-color: var(--eduai-gold, #946B1C) !important;
        border-color: var(--eduai-gold, #946B1C) !important;
        color: #fff !important;
    }
    .btn-gold:hover {
        background-color: #7a5917 !important;
        border-color: #7a5917 !important;
        color: #fff !important;
    }
    .text-gold {
        color: var(--eduai-gold, #946B1C) !important;
    }
</style>

<form method="post" action="{% if mode == 'create' %}{% url action_url %}{% else %}{% url action_url book.id %}{% endif %}">
    {% csrf_token %}
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" value="{% if mode == 'edit' %}{{ book.title }}{% endif %}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-semibold">Author <span class="text-danger">*</span></label>
            <input type="text" name="author" class="form-control" value="{% if mode == 'edit' %}{{ book.author }}{% endif %}" required>
        </div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
            <select name="category" class="form-select" required>
                <option value="">Select Category</option>
                {% for c in categories %}
                    <option value="{{ c.id }}" {% if mode == 'edit' and book.category.id == c.id %}selected{% endif %}>
                        {{ c.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-semibold">ISBN <span class="text-muted fw-normal">(optional)</span></label>
            <input type="text" name="isbn" class="form-control" value="{% if mode == 'edit' %}{{ book.isbn }}{% endif %}">
        </div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label fw-semibold">Total Copies</label>
            <input type="number" name="total_copies" class="form-control" min="1" value="{% if mode == 'edit' %}{{ book.total_copies }}{% else %}1{% endif %}">
        </div>
        <div class="col-md-6">
            <label class="form-label fw-semibold">Shelf Location</label>
            <input type="text" name="shelf_location" class="form-control" placeholder="e.g., A1, Shelf 3" value="{% if mode == 'edit' %}{{ book.shelf_location }}{% endif %}">
        </div>
    </div>
    <div class="mb-4">
        <label class="form-label fw-semibold">Description <span class="text-muted fw-normal">(optional)</span></label>
        <textarea name="description" class="form-control" rows="3">{{ book.description|default:'' }}</textarea>
    </div>
    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-gold">
            <i class="bi {% if mode == 'create' %}bi-check2-circle{% else %}bi-pencil-square{% endif %} me-1"></i>
            {% if mode == 'create' %}Add Book{% else %}Save Changes{% endif %}
        </button>
    </div>
</form>

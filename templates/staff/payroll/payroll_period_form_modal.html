<style>
    .btn-gold {
        background-color: var(--eduai-gold, #946B1C) !important;
        border-color: var(--eduai-gold, #946B1C) !important;
        color: #fff !important;
    }
    .btn-gold:hover {
        background-color: #7a5917 !important;
        border-color: #7a5917 !important;
        color: #fff !important;
    }
    .text-gold {
        color: var(--eduai-gold, #946B1C) !important;
    }
</style>

<form method="post" action="{% if mode == 'create' %}{% url action_url %}{% endif %}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Period Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" placeholder="e.g., January 2025 Payroll" required>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label fw-semibold">Start Date <span class="text-danger">*</span></label>
            <input type="date" name="period_start" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-semibold">End Date <span class="text-danger">*</span></label>
            <input type="date" name="period_end" class="form-control" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Payment Date <span class="text-danger">*</span></label>
        <input type="date" name="payment_date" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Notes</label>
        <textarea name="notes" class="form-control" rows="3" placeholder="Additional notes about this payroll period"></textarea>
    </div>

    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-gold">
            <i class="bi bi-plus-circle me-1"></i> Create Period
        </button>
    </div>
</form>

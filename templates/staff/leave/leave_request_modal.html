<style>
    .btn-gold {
        background-color: var(--eduai-gold, #946B1C) !important;
        border-color: var(--eduai-gold, #946B1C) !important;
        color: #fff !important;
    }
    .btn-gold:hover { background-color: #7a5917 !important; border-color: #7a5917 !important; color: #fff !important; }
    .form-label { font-weight: 600; font-size: 0.85rem; }
</style>

<div class="modal-header border-0 pt-4 px-4 pb-0">
    <h5 class="modal-title fw-bold">
        <i class="bi bi-calendar-plus text-gold me-2"></i>Request Leave
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<form method="post" action="{% url 'staff:leave_request' %}">
    {% csrf_token %}

    <div class="modal-body p-4">
        <div class="mb-3">
            <label class="form-label">Leave Type <span class="text-danger">*</span></label>
            <select name="leave_type" class="form-select" required>
                <option value="">Select Leave Type</option>
                <option value="ANNUAL">Annual Leave</option>
                <option value="SICK">Sick Leave</option>
                <option value="MATERNITY">Maternity Leave</option>
                <option value="PATERNITY">Paternity Leave</option>
                <option value="STUDY">Study Leave</option>
                <option value="COMPASSIONATE">Compassionate Leave</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Start Date <span class="text-danger">*</span></label>
                <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">End Date <span class="text-danger">*</span></label>
                <input type="date" name="end_date" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Reason <span class="text-danger">*</span></label>
            <textarea name="reason" class="form-control" rows="3"
                      placeholder="Please provide a detailed reason for your leave request" required></textarea>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Contact Number (during leave)</label>
                <input type="tel" name="contact_number" class="form-control" placeholder="e.g., +233 XX XXX XXXX">
            </div>
            <div class="col-md-6">
                <label class="form-label">Emergency Contact</label>
                <input type="text" name="emergency_contact" class="form-control" placeholder="Name and phone number">
            </div>
        </div>
    </div>

    <div class="modal-footer border-0 px-4 pb-4">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-circle me-1"></i>Cancel
        </button>
        <button type="submit" class="btn btn-gold">
            <i class="bi bi-send me-1"></i>Submit Request
        </button>
    </div>
</form>

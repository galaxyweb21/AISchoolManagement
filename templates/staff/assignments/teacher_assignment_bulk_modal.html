<!-- staff/assignments/teacher_assignment_bulk_modal.html -->
<form method="post" action="{% url 'staff:teacher_assignment_bulk_create' %}" id="bulkAssignmentForm">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label fw-semibold">Class <span class="text-danger">*</span></label>
        <select name="school_class" class="form-select" id="bulkClassSelect" required>
            <option value="">Select Class</option>
            {% for class in classes %}
                <option value="{{ class.id }}">
                    {{ class.name }} ({{ class.grade_level.name }})
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Teacher <span class="text-danger">*</span></label>
        <select name="teacher" class="form-select" id="bulkTeacherSelect" required>
            <option value="">Select Teacher</option>
            {% for teacher in teachers %}
                <option value="{{ teacher.id }}">
                    {{ teacher.user.get_full_name }} ({{ teacher.staff_number }})
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Periods Per Week</label>
        <input type="number" name="periods_per_week" class="form-control" value="4" min="1" max="10">
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Subjects to Assign <span class="text-danger">*</span></label>
        <div class="border rounded-3 p-3 bg-light" style="max-height: 220px; overflow-y: auto;" id="subjectContainer">
            <p class="text-muted mb-0">Select a class first. Only that class's subjects will appear.</p>
        </div>
        <div class="mt-2">
            <button type="button" class="btn btn-sm btn-outline-secondary select-all-btn">
                <i class="bi bi-check-all me-1"></i>Select All
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary deselect-all-btn">
                <i class="bi bi-x-circle me-1"></i>Deselect All
            </button>
        </div>
        <small class="text-muted">Select multiple subjects to assign the teacher to all of them in this class.</small>
    </div>

    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" style="background-color: var(--eduai-gold, #946B1C); border-color: var(--eduai-gold, #946B1C);">
            <i class="bi bi-list-plus me-1"></i> Bulk Assign
        </button>
    </div>
</form>

<script>
(function () {
    const form = document.getElementById('bulkAssignmentForm');
    if (!form) return;

    const classSelect = document.getElementById('bulkClassSelect');
    const subjectContainer = document.getElementById('subjectContainer');
    const endpoint = "{% url 'staff:teacher_assignment_subject_options' %}";

    function esc(value) {
        return String(value).replace(/[&<>"']/g, function (c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }

    function renderSubjects(subjects) {
        if (!subjects.length) {
            subjectContainer.innerHTML = '<p class="text-muted mb-0">No subjects have been assigned to this class yet. Add them from Academics → Subjects → Apply to Classes.</p>';
            return;
        }

        subjectContainer.innerHTML = subjects.map(function (subject) {
            const id = 'bulk_subject_' + subject.id;
            return '<div class="form-check mb-2">' +
                '<input class="form-check-input subject-checkbox" type="checkbox" name="subjects" value="' + esc(subject.id) + '" id="' + esc(id) + '">' +
                '<label class="form-check-label" for="' + esc(id) + '">' +
                esc(subject.name) + (subject.code ? ' (' + esc(subject.code) + ')' : '') +
                '</label></div>';
        }).join('');
    }

    async function loadSubjects() {
        const classId = classSelect.value;
        if (!classId) {
            renderSubjects([]);
            return;
        }

        subjectContainer.innerHTML = '<div class="text-muted small"><span class="spinner-border spinner-border-sm me-2"></span>Loading class subjects...</div>';

        try {
            const response = await fetch(endpoint + '?class_id=' + encodeURIComponent(classId), {
                credentials: 'same-origin',
                headers: {'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json'}
            });
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(data.error || 'Unable to load class subjects.');
            renderSubjects(data.subjects || []);
        } catch (error) {
            subjectContainer.innerHTML = '<div class="alert alert-danger py-2 mb-0">' + esc(error.message) + '</div>';
        }
    }

    classSelect.addEventListener('change', loadSubjects);

    const selectAllBtn = form.querySelector('.select-all-btn');
    const deselectAllBtn = form.querySelector('.deselect-all-btn');

    if (selectAllBtn) {
        selectAllBtn.addEventListener('click', function () {
            form.querySelectorAll('.subject-checkbox').forEach(function (cb) {
                cb.checked = true;
            });
        });
    }

    if (deselectAllBtn) {
        deselectAllBtn.addEventListener('click', function () {
            form.querySelectorAll('.subject-checkbox').forEach(function (cb) {
                cb.checked = false;
            });
        });
    }
})();
</script>

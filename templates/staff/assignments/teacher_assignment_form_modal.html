<!-- staff/assignments/teacher_assignment_form_modal.html -->
<form method="post" action="{% if mode == 'create' %}{% url action_url %}{% else %}{% url action_url assignment.id %}{% endif %}">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label fw-semibold">Teacher <span class="text-danger">*</span></label>
        <select name="teacher" class="form-select" required>
            <option value="">Select Teacher</option>
            {% for teacher in teachers %}
                <option value="{{ teacher.id }}" {% if mode == 'edit' and assignment.teacher.id == teacher.id %}selected{% endif %}>
                    {{ teacher.user.get_full_name }} ({{ teacher.staff_number }})
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label fw-semibold">Class <span class="text-danger">*</span></label>
            <select name="school_class" class="form-select" required>
                <option value="">Select Class</option>
                {% for class in classes %}
                    <option value="{{ class.id }}" {% if mode == 'edit' and assignment.school_class.id == class.id %}selected{% endif %}>
                        {{ class.name }} ({{ class.grade_level.name }})
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-semibold">Subject <span class="text-danger">*</span></label>
            <select name="subject" class="form-select" required>
                <option value="">Select Subject</option>
                {% for subject in subjects %}
                    <option value="{{ subject.id }}" {% if mode == 'edit' and assignment.subject.id == subject.id %}selected{% endif %}>
                        {{ subject.name }} ({{ subject.code }})
                    </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label fw-semibold">Periods Per Week</label>
            <input type="number" name="periods_per_week" class="form-control"
                   value="{% if mode == 'edit' %}{{ assignment.periods_per_week }}{% else %}4{% endif %}"
                   min="1" max="10" required>
        </div>
        <div class="col-md-6">
            <div class="form-check mt-4">
                <input class="form-check-input" type="checkbox" name="is_primary" id="is_primary"
                       {% if mode == 'edit' and assignment.is_primary %}checked{% endif %}>
                <label class="form-check-label" for="is_primary">
                    Primary Teacher for this Class
                </label>
            </div>
        </div>
    </div>

    {% if mode == 'edit' %}
    <div class="mb-3">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                   {% if assignment.is_active %}checked{% endif %}>
            <label class="form-check-label" for="is_active">Active</label>
        </div>
    </div>
    {% endif %}

    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" style="background-color: var(--eduai-gold, #946B1C); border-color: var(--eduai-gold, #946B1C);">
            <i class="bi {% if mode == 'create' %}bi-plus-circle{% else %}bi-pencil-square{% endif %} me-1"></i>
            {% if mode == 'create' %}Create Assignment{% else %}Save Changes{% endif %}
        </button>
    </div>
</form>

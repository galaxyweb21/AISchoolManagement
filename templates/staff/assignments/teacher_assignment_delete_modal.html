<!-- staff/assignments/teacher_assignment_delete_modal.html -->
<form method="post" action="{% url action_url assignment.id %}" class="delete-form">
    {% csrf_token %}
    <div class="text-center py-3">
        <div class="mb-3">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3.5rem;"></i>
        </div>
        <h5 class="fw-bold mb-2">Delete Teacher Assignment</h5>
        <p class="text-muted mb-0">
            Are you sure you want to delete this assignment?
        </p>
        <p class="fw-bold mb-2">
            "{{ assignment.teacher.user.get_full_name }}" teaching
            {{ assignment.subject.name }} in {{ assignment.school_class.name }}
        </p>
        <p class="text-muted small">
            <i class="bi bi-info-circle me-1"></i>
            This action cannot be undone.
        </p>
    </div>
    <div class="d-flex gap-2 justify-content-center border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i> Confirm Delete
        </button>
    </div>
</form>

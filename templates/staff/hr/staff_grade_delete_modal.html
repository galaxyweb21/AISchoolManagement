<!-- staff/hr/staff_grade_delete_modal.html -->
<style>
    #deleteGradeModalContent {
        /* Hard floor for bottom spacing: even if the parent .modal-body
           has zero padding, this partial still gets breathing room at
           the bottom. Adjust this one variable if you ever need more/less. */
        --delete-modal-bottom-space: 1.75rem;
        padding: 0.25rem 0.25rem var(--delete-modal-bottom-space) 0.25rem !important;
    }
    #deleteGradeModalContent .dgm-icon-ring {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 30%, rgba(220, 53, 69, 0.18), rgba(220, 53, 69, 0.08));
        border: 1px solid rgba(220, 53, 69, 0.25);
    }
    #deleteGradeModalContent .dgm-icon-ring i {
        font-size: 2.1rem;
        color: #dc3545;
    }
    #deleteGradeModalContent .dgm-title {
        font-size: 1.15rem;
        font-weight: 700;
        margin-bottom: 0.5rem !important;
    }
    #deleteGradeModalContent .dgm-grade-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-weight: 700;
        padding: 0.2rem 0.65rem;
        border-radius: 8px;
        background: rgba(220, 53, 69, 0.10);
        color: #dc3545;
    }
    #deleteGradeModalContent .dgm-subtext {
        color: var(--bs-secondary-color);
        font-size: 0.85rem;
        max-width: 380px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.5;
    }
    #deleteGradeModalContent .dgm-warning {
        display: flex;
        align-items: flex-start;
        gap: 0.65rem;
        background: rgba(255, 193, 7, 0.10);
        border: 1px solid rgba(255, 193, 7, 0.30);
        border-radius: 14px;
        padding: 0.9rem 1rem;
        margin: 1.5rem 0 !important;
        text-align: left;
    }
    #deleteGradeModalContent .dgm-warning i {
        color: #d39e00;
        font-size: 1.1rem;
        margin-top: 0.1rem;
        flex-shrink: 0;
    }
    #deleteGradeModalContent .dgm-warning span {
        font-size: 0.85rem;
        color: var(--bs-body-color);
        line-height: 1.5;
    }
    #deleteGradeModalContent .dgm-actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        border-top: 1px solid var(--bs-border-color);
        padding-top: 1.25rem !important;
        padding-bottom: 0.25rem !important;
        margin-top: 0.25rem;
    }
    #deleteGradeModalContent .dgm-actions .btn {
        min-width: 130px;
        border-radius: 10px;
        font-weight: 600;
        padding: 0.55rem 1rem;
    }
    #deleteGradeModalContent .btn-outline-secondary-dgm {
        background: transparent;
        border: 1px solid var(--bs-border-color);
        color: var(--bs-body-color);
    }
    #deleteGradeModalContent .btn-outline-secondary-dgm:hover {
        background: var(--bs-tertiary-bg);
    }
    #deleteGradeModalContent .btn-danger-dgm {
        background: #dc3545;
        border: 1px solid #dc3545;
        color: #fff;
    }
    #deleteGradeModalContent .btn-danger-dgm:hover {
        background: #bb2d3b;
        border-color: #b02a37;
        color: #fff;
    }
</style>

<div id="deleteGradeModalContent">
    <form method="post" action="{% url action_url grade.id %}" class="delete-form">
        {% csrf_token %}

        <div class="text-center pt-2 pb-1">
            <div class="mb-3">
                <span class="dgm-icon-ring">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </span>
            </div>

            <h5 class="dgm-title">Delete Staff Grade</h5>

            <p class="mb-2">
                Are you sure you want to delete
                <span class="dgm-grade-chip"><i class="bi bi-layers-fill" style="font-size:0.7rem;"></i>{{ grade.name }}</span>?
            </p>

            <p class="dgm-subtext mb-0">
                This action cannot be undone if the grade is not linked to any salary structures.
            </p>
        </div>

        <div class="dgm-warning">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>
                Grades already assigned to staff or salary structures cannot be deleted.
                Reassign those staff first.
            </span>
        </div>

        <div class="dgm-actions">
            <button type="button" class="btn btn-outline-secondary-dgm" data-bs-dismiss="modal">
                <i class="bi bi-x-circle me-1"></i>Cancel
            </button>
            <button type="submit" class="btn btn-danger-dgm">
                <i class="bi bi-trash me-1"></i>Confirm Delete
            </button>
        </div>
    </form>
</div>

<form method="post" action="{% url action_url department.id %}" class="delete-form">
{% csrf_token %}
<div class="modal-header border-0 px-4 pt-4"><h5 class="modal-title fw-bold text-danger"><i class="bi bi-trash3 me-2"></i>Delete Department</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body px-4"><div class="alert alert-warning border-0 rounded-3"><i class="bi bi-exclamation-triangle me-2"></i>This action cannot be undone.</div><p>Delete <strong>{{ department.name }}</strong> ({{ department.code }})?</p>{% if department.staff_members.count %}<div class="alert alert-danger border-0">This department has {{ department.staff_members.count }} staff member(s). Reassign them before deleting.</div>{% endif %}</div>
<div class="modal-footer border-0 px-4 pb-4"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-danger" {% if department.staff_members.count %}disabled{% endif %}><i class="bi bi-trash3 me-1"></i>Delete Department</button></div>
</form>

<!-- templates/partials/messages_ajax.html -->
{% if messages %}
<div id="ajaxMessagesContainer" class="container-fluid px-4">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% elif message.tags == 'success' %}success{% else %}info{% endif %} border-0 shadow-sm rounded-4 alert-dismissible fade show mt-2" role="alert">
        <div class="d-flex align-items-center gap-2">
            <i class="bi
                {% if message.tags == 'error' %}bi-exclamation-circle-fill text-danger
                {% elif message.tags == 'warning' %}bi-exclamation-triangle-fill text-warning
                {% elif message.tags == 'success' %}bi-check-circle-fill text-success
                {% else %}bi-info-circle-fill text-info{% endif %}
                fs-5
            "></i>
            <span>{{ message }}</span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}

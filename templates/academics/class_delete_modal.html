<form method="post" action="{% url action_url school_class.id %}">
    {% csrf_token %}
    <p class="mb-4 text-center">
        Are you sure you want to delete the class <strong>"{{ school_class.name }}"</strong>?<br>
        <span class="text-muted small">This action cannot be undone.</span>
    </p>
    <div class="d-flex gap-2 justify-content-center border-top pt-3">
        <button type="button" class="btn" style="border-color: var(--text-muted, #6B7570); color: var(--text-muted, #6B7570); background: transparent;" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn" style="background: #dc2626; color: #fff; border-color: #dc2626;">
            <i class="bi bi-trash me-1"></i> Confirm Delete
        </button>
    </div>
</form>

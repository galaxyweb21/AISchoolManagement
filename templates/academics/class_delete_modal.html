<form method="post" action="{% url action_url school_class.id %}" class="delete-form">
    {% csrf_token %}

    <div class="text-center pt-4 pb-2 px-4">
        <div class="mb-3">
            <div class="rounded-circle bg-danger-subtle d-inline-flex align-items-center justify-content-center"
                 style="width: 72px; height: 72px;">
                <i class="bi bi-trash3 text-danger fs-1"></i>
            </div>
        </div>
        <h5 class="fw-bold mb-2">Delete Class</h5>
        <p class="text-muted mb-1">
            Are you sure you want to delete the class <strong>"{{ school_class.name }}"</strong>?
        </p>
        <p class="text-muted small mb-0">
            <i class="bi bi-info-circle me-1"></i>
            This action cannot be undone.
        </p>
    </div>

    <div class="px-4 mb-4">
        <div class="alert alert-warning border-0 rounded-4 mb-0">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Deleting this class will also remove all associated subject assignments and teacher assignments.
        </div>
    </div>

    <div class="d-flex gap-2 justify-content-center border-top pt-4 pb-4 px-4" style="margin-bottom: 1rem;">
        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">
            <i class="bi bi-x-circle me-1"></i>Cancel
        </button>
        <button type="submit" class="btn btn-danger px-4">
            <i class="bi bi-trash me-1"></i>Confirm Delete
        </button>
    </div>
</form>

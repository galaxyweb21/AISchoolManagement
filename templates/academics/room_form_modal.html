<form method="post" action="{% if mode == 'create' %}{% url action_url %}{% else %}{% url action_url room.id %}{% endif %}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Room Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" placeholder="e.g., Room 302" value="{% if mode == 'edit' %}{{ room.name }}{% endif %}" required>
    </div>
    <div class="mb-3">
        <label class="form-label fw-semibold">Capacity</label>
        <input type="number" name="capacity" class="form-control" min="1" value="{% if mode == 'edit' %}{{ room.capacity }}{% else %}40{% endif %}">
    </div>
    <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" name="is_lab" id="isLab" {% if mode == 'edit' and room.is_lab %}checked{% endif %}>
        <label class="form-check-label fw-semibold" for="isLab">This is a Laboratory Room</label>
    </div>
    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn" style="border-color: var(--text-muted, #6B7570); color: var(--text-muted, #6B7570); background: transparent;" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn" style="background: var(--primary-color, #946B1C); color: #fff; border-color: var(--primary-color, #946B1C);">
            <i class="bi {% if mode == 'create' %}bi-check2-circle{% else %}bi-pencil-square{% endif %} me-1"></i>
            {% if mode == 'create' %}Add Room{% else %}Save Changes{% endif %}
        </button>
    </div>
</form>

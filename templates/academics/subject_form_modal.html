<form method="post" action="{% if mode == 'create' %}{% url action_url %}{% else %}{% url action_url subject.id %}{% endif %}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Subject Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" placeholder="e.g., Mathematics" value="{% if mode == 'edit' %}{{ subject.name }}{% endif %}" required>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Curriculum Level <span class="text-danger">*</span></label>
        <select name="curriculum_level" class="form-select" required>
            {% for value, label in curriculum_levels %}
                <option value="{{ value }}" {% if mode == 'edit' and subject.curriculum_level == value or mode == 'create' and value == 'ALL' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <div class="form-text">This determines which class levels can select the subject. Use General / All levels for a subject shared across stages.</div>
    </div>

    <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" name="requires_lab" id="requiresLab" {% if mode == 'edit' and subject.requires_lab %}checked{% endif %}>
        <label class="form-check-label fw-semibold" for="requiresLab">Requires a Lab Room</label>
    </div>
    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn" style="border-color: var(--text-muted, #6B7570); color: var(--text-muted, #6B7570); background: transparent;" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn" style="background: var(--primary-color, #946B1C); color: #fff; border-color: var(--primary-color, #946B1C);">
            <i class="bi {% if mode == 'create' %}bi-check2-circle{% else %}bi-pencil-square{% endif %} me-1"></i>
            {% if mode == 'create' %}Add Subject{% else %}Save Changes{% endif %}
        </button>
    </div>
</form>

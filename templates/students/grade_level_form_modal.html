<style>
    .btn-gold {
        background-color: var(--eduai-gold, #946B1C) !important;
        border-color: var(--eduai-gold, #946B1C) !important;
        color: #fff !important;
    }
    .btn-gold:hover {
        background-color: #7a5917 !important;
        border-color: #7a5917 !important;
        color: #fff !important;
    }
    .text-gold {
        color: var(--eduai-gold, #946B1C) !important;
    }
</style>

<form method="post"
      action="{% if mode == 'create' %}{% url action_url %}{% else %}{% url action_url grade_level.id %}{% endif %}"
      data-action="{% if mode == 'create' %}create{% else %}update{% endif %}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Grade Level Name</label>
        <input type="text" name="name" class="form-control" placeholder="e.g., Grade 10, Year 11"
               value="{% if mode == 'edit' %}{{ grade_level.name }}{% endif %}" required>
    </div>
    <div class="mb-4">
        <label class="form-label fw-semibold">Display Order <span class="text-muted fw-normal">(lower numbers appear first)</span></label>
        <input type="number" name="order" class="form-control" min="0" value="{% if mode == 'edit' %}{{ grade_level.order }}{% else %}0{% endif %}">
    </div>
    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-gold">
            <i class="bi {% if mode == 'create' %}bi-check2-circle{% else %}bi-pencil-square{% endif %} me-1"></i>
            {% if mode == 'create' %}Create{% else %}Save Changes{% endif %}
        </button>
    </div>
</form>

<form method="post" action="{% url action_url grade_level.id %}" class="delete-form" data-action="delete">
    {% csrf_token %}
    <p class="mb-4 text-center">
        Are you sure you want to delete the grade level <strong>"{{ grade_level.name }}"</strong>?<br>
        <span class="text-muted small">This action cannot be undone.</span>
    </p>
    <div class="d-flex gap-2 justify-content-center border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i> Confirm Delete
        </button>
    </div>
</form>

<style>
.fee-addon-modal .item-row{background:var(--bs-tertiary-bg,#f8f9fa);border:1px solid var(--bs-border-color,#dee2e6);border-radius:14px;padding:14px;margin-bottom:10px}
.fee-addon-modal .item-row:hover{border-color:var(--eduai-gold,#946B1C)}
.fee-addon-modal .summary-box{background:var(--bs-tertiary-bg,#f8f9fa);border:1px solid var(--bs-border-color,#dee2e6);border-radius:14px;padding:14px}
</style>

<form method="post"
      action="{% if mode == 'create' %}{% url action_url %}{% else %}{% url action_url addon.id %}{% endif %}"
      class="addon-form fee-addon-modal" data-mode="{{ mode }}">
    {% csrf_token %}

    <div class="row g-3 mb-3">
        <div class="col-md-7">
            <label class="form-label fw-semibold">Add-on Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required
                   value="{% if mode == 'edit' %}{{ addon.name }}{% endif %}"
                   placeholder="e.g. New Student Uniform Package">
        </div>
        <div class="col-md-5">
            <label class="form-label fw-semibold">Academic Term <span class="text-danger">*</span></label>
            <select name="academic_term" class="form-select" required>
                <option value="">Select term</option>
                {% for term in terms %}
                <option value="{{ term.id }}" {% if mode == 'edit' and addon.academic_term_id == term.id %}selected{% endif %}>
                    {{ term.academic_year.name }} — {{ term.name }}
                </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-4"><div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="apply_to_new_students_only" id="applyToNewOnly" {% if mode == 'create' or addon.apply_to_new_students_only %}checked{% endif %}>
            <label class="form-check-label fw-semibold" for="applyToNewOnly">New students only</label>
        </div></div>
        <div class="col-md-4"><div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="is_active" id="isActive" {% if mode == 'create' or addon.is_active %}checked{% endif %}>
            <label class="form-check-label fw-semibold" for="isActive">Active</label>
        </div></div>
        <div class="col-md-4"><div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="is_required" id="isRequired">
            <label class="form-check-label fw-semibold" for="isRequired">Required</label>
        </div></div>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="2" placeholder="Optional description">{% if mode == 'edit' %}{{ addon.description|default:'' }}{% endif %}</textarea>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
            <label class="form-label fw-semibold mb-0">Fee Items <span class="text-danger">*</span></label>
            <div class="small text-muted">Add one or more fee categories and amounts.</div>
        </div>
        <button type="button" class="btn btn-sm btn-gold" id="addFeeAddonItemBtn">
            <i class="bi bi-plus-lg me-1"></i>Add Item
        </button>
    </div>

    <div id="feeAddonItemsContainer">
        {% if existing_items %}
            {% for item in existing_items %}
            <div class="item-row fee-addon-item-row">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Fee Category</label>
                        <select name="categories" class="form-select" required>
                            <option value="">Select category</option>
                            {% for category in fee_categories %}
                            <option value="{{ category.id }}" {% if item.fee_category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Amount (GH¢)</label>
                        <input type="number" name="amounts" class="form-control" step="0.01" min="0.01" required value="{{ item.amount }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Description</label>
                        <input type="text" name="descriptions" class="form-control" value="{{ item.description|default:'' }}" placeholder="Optional">
                    </div>
                    <div class="col-md-1 text-end">
                        <button type="button" class="btn btn-outline-danger remove-fee-addon-item" title="Remove item"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="item-row fee-addon-item-row">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Fee Category</label>
                        <select name="categories" class="form-select" required>
                            <option value="">Select category</option>
                            {% for category in fee_categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3"><label class="form-label small text-muted">Amount (GH¢)</label><input type="number" name="amounts" class="form-control" step="0.01" min="0.01" required placeholder="0.00"></div>
                    <div class="col-md-4"><label class="form-label small text-muted">Description</label><input type="text" name="descriptions" class="form-control" placeholder="Optional"></div>
                    <div class="col-md-1 text-end"><button type="button" class="btn btn-outline-danger remove-fee-addon-item" title="Remove item"><i class="bi bi-trash"></i></button></div>
                </div>
            </div>
        {% endif %}
    </div>

    <div id="feeAddonItemError" class="alert alert-danger py-2 d-none mt-2">Add at least one valid fee item.</div>

    <div class="summary-box mt-3">
        <div class="d-flex justify-content-between"><span class="text-muted">Items</span><strong id="feeAddonItemCount">1</strong></div>
        <div class="d-flex justify-content-between mt-1"><span class="text-muted">Total</span><strong id="feeAddonTotal">GH¢ 0.00</strong></div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-gold"><i class="bi bi-check2-circle me-1"></i>{% if mode == 'edit' %}Save Changes{% else %}Create Add-on{% endif %}</button>
    </div>
</form>

<script>
(function(){
    function initFeeAddonForm(){
        const root=document.querySelector('.fee-addon-modal');
        if(!root || root.dataset.initialized==='1') return;
        root.dataset.initialized='1';
        const container=root.querySelector('#feeAddonItemsContainer');
        const addBtn=root.querySelector('#addFeeAddonItemBtn');
        const countEl=root.querySelector('#feeAddonItemCount');
        const totalEl=root.querySelector('#feeAddonTotal');
        const errorEl=root.querySelector('#feeAddonItemError');
        if(!container || !addBtn) return;

        function options(){
            const select=container.querySelector('select[name="categories"]');
            return select ? select.innerHTML : '<option value="">Select category</option>';
        }
        function row(){
            const div=document.createElement('div');
            div.className='item-row fee-addon-item-row';
            div.innerHTML='<div class="row g-2 align-items-end">'+
                '<div class="col-md-4"><label class="form-label small text-muted">Fee Category</label><select name="categories" class="form-select" required>'+options()+'</select></div>'+
                '<div class="col-md-3"><label class="form-label small text-muted">Amount (GH¢)</label><input type="number" name="amounts" class="form-control" step="0.01" min="0.01" required placeholder="0.00"></div>'+
                '<div class="col-md-4"><label class="form-label small text-muted">Description</label><input type="text" name="descriptions" class="form-control" placeholder="Optional"></div>'+
                '<div class="col-md-1 text-end"><button type="button" class="btn btn-outline-danger remove-fee-addon-item" title="Remove item"><i class="bi bi-trash"></i></button></div></div>';
            return div;
        }
        function refresh(){
            const rows=[...container.querySelectorAll('.fee-addon-item-row')];
            if(countEl) countEl.textContent=rows.length;
            let total=0;
            rows.forEach(r=>{ total += parseFloat(r.querySelector('input[name="amounts"]')?.value)||0; });
            if(totalEl) totalEl.textContent='GH¢ '+total.toFixed(2);
            if(errorEl) errorEl.classList.toggle('d-none', rows.some(r=>r.querySelector('select[name="categories"]')?.value && (parseFloat(r.querySelector('input[name="amounts"]')?.value)||0)>0));
        }
        addBtn.addEventListener('click',function(e){e.preventDefault(); container.appendChild(row()); refresh(); container.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});});
        container.addEventListener('click',function(e){
            const btn=e.target.closest('.remove-fee-addon-item');
            if(!btn) return;
            e.preventDefault();
            const rows=container.querySelectorAll('.fee-addon-item-row');
            if(rows.length>1) btn.closest('.fee-addon-item-row').remove();
            else { btn.closest('.fee-addon-item-row').querySelectorAll('input,select').forEach(x=>{if(x.tagName==='SELECT')x.selectedIndex=0;else x.value='';}); }
            refresh();
        });
        container.addEventListener('input',refresh);
        container.addEventListener('change',refresh);
        root.addEventListener('submit',function(e){
            const valid=[...container.querySelectorAll('.fee-addon-item-row')].some(r=>r.querySelector('select[name="categories"]')?.value && (parseFloat(r.querySelector('input[name="amounts"]')?.value)||0)>0);
            if(!valid){e.preventDefault(); if(errorEl) errorEl.classList.remove('d-none');}
        });
        refresh();
    }
    initFeeAddonForm();
    window.initFeeAddonForm=initFeeAddonForm;
})();
</script>

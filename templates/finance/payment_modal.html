<style>
#paymentForm{--pay-accent:var(--eduai-gold,#946B1C)}
.payment-shell{background:var(--bs-body-bg);border-radius:18px}
.payment-header{background:linear-gradient(135deg,var(--bs-tertiary-bg),var(--bs-body-bg));border-bottom:1px solid var(--bs-border-color);padding:18px 22px}
.invoice-picker{max-height:260px;overflow:auto;border:1px solid var(--bs-border-color);border-radius:14px;padding:8px}
.invoice-option{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;cursor:pointer;margin:2px 0}
.invoice-option:hover{background:var(--bs-tertiary-bg)}
.invoice-option input{width:19px;height:19px;flex:0 0 auto}
.invoice-meta{min-width:0;flex:1}.invoice-balance{font-weight:700;white-space:nowrap}
.payment-summary{background:var(--bs-tertiary-bg);border:1px solid var(--bs-border-color);border-radius:14px;padding:15px}
.payment-total{font-size:1.35rem;font-weight:800;color:var(--eduai-signal,#2C7A6D)}
</style>

<div class="payment-shell">
<form id="paymentForm" method="post" action="{% url 'finance:api_record_payment' %}" novalidate>
{% csrf_token %}
<div class="payment-header d-flex justify-content-between align-items-center">
  <div><div class="fw-bold fs-5"><i class="bi bi-cash-coin me-2 text-success"></i>Record Payment</div><small class="text-muted">Select an invoice, enter the amount and save the payment.</small></div>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="p-4">
  <div id="paymentAlert" class="alert d-none rounded-3"></div>
  <div class="mb-3">
    <div class="d-flex justify-content-between align-items-center mb-2"><label class="form-label fw-semibold mb-0">Invoice <span class="text-danger">*</span></label><button type="button" class="btn btn-sm btn-outline-secondary" id="paymentSelectAll">Select all</button></div>
    <div class="invoice-picker" id="paymentInvoiceList">
      {% for invoice in invoices %}
      <label class="invoice-option" for="pay_invoice_{{ invoice.id }}">
        <input class="form-check-input invoice-checkbox" id="pay_invoice_{{ invoice.id }}" type="checkbox" name="invoice_ids" value="{{ invoice.id }}" data-balance="{{ invoice.balance_due|floatformat:2 }}" data-number="{{ invoice.invoice_number }}" data-student="{{ invoice.student.user.get_full_name|escapejs }}">
        <span class="invoice-meta"><span class="fw-semibold">{{ invoice.invoice_number }}</span><span class="text-muted d-block small">{{ invoice.student.user.get_full_name }} · Due {{ invoice.due_date|date:'d M Y' }}</span></span>
        <span class="invoice-balance text-danger">GH¢ {{ invoice.balance_due|floatformat:2 }}</span>
      </label>
      {% empty %}<div class="text-center py-4 text-muted"><i class="bi bi-receipt fs-2 d-block mb-2"></i>No unpaid invoices available.</div>{% endfor %}
    </div>
    <div id="paymentInvoiceError" class="text-danger small mt-1 d-none">Select at least one invoice.</div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold">Payment Amount <span class="text-danger">*</span></label>
      <div class="input-group"><span class="input-group-text">GH¢</span><input id="paymentAmount" name="amount" type="number" step="0.01" min="0.01" class="form-control form-control-lg" placeholder="0.00" required></div>
      <div class="d-flex justify-content-between mt-1"><small id="paymentMax" class="text-muted">Outstanding: GH¢ 0.00</small><button type="button" id="paymentFull" class="btn btn-link btn-sm p-0">Pay full</button></div>
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold">Payment Method <span class="text-danger">*</span></label>
      <select id="paymentMethod" name="method" class="form-select form-select-lg" required><option value="">Select method</option><option value="CASH">Cash</option><option value="BANK_TRANSFER">Bank Transfer</option><option value="MOBILE_MONEY">Mobile Money</option><option value="CARD">Card</option><option value="CHEQUE">Cheque</option><option value="ONLINE_GATEWAY">Online Gateway</option></select>
    </div>
  </div>

  <div class="payment-summary mt-3">
    <div class="d-flex justify-content-between"><span class="text-muted">Selected invoices</span><strong id="paymentSelectedCount">0</strong></div>
    <div class="d-flex justify-content-between mt-1"><span class="text-muted">Outstanding balance</span><strong id="paymentOutstanding">GH¢ 0.00</strong></div>
    <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top"><span class="fw-bold">Payment</span><span id="paymentSummaryAmount" class="payment-total">GH¢ 0.00</span></div>
  </div>

  <div class="row g-3 mt-1">
    <div class="col-md-6"><label class="form-label fw-semibold">Reference</label><input id="paymentReference" name="reference_number" class="form-control" maxlength="100" placeholder="Transaction / cheque number"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Notes</label><input id="paymentNotes" name="notes" class="form-control" maxlength="200" placeholder="Optional note"></div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" id="paymentSubmitBtn" class="btn btn-success px-4"><i class="bi bi-check2-circle me-1"></i>Record Payment</button></div>
</div>
</form>
</div>

<script>
(function(){
  function init(){
    const form=document.getElementById('paymentForm'); if(!form || form.dataset.ready==='1') return; form.dataset.ready='1';
    const boxes=[...form.querySelectorAll('.invoice-checkbox')], amount=document.getElementById('paymentAmount'), method=document.getElementById('paymentMethod'), alertBox=document.getElementById('paymentAlert');
    const selectedCount=document.getElementById('paymentSelectedCount'), outstanding=document.getElementById('paymentOutstanding'), summary=document.getElementById('paymentSummaryAmount'), max=document.getElementById('paymentMax'), invoiceError=document.getElementById('paymentInvoiceError');
    function csrf(){return form.querySelector('[name=csrfmiddlewaretoken]')?.value || document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith('csrftoken='))?.split('=')[1] || '';}
    function show(msg,type='danger'){alertBox.className='alert alert-'+type+' rounded-3';alertBox.textContent=msg;alertBox.classList.remove('d-none');alertBox.scrollIntoView({block:'nearest'});}
    function refresh(){
      const chosen=boxes.filter(b=>b.checked); let total=chosen.reduce((s,b)=>s+(parseFloat(b.dataset.balance)||0),0); total=Math.round(total*100)/100;
      selectedCount.textContent=chosen.length; outstanding.textContent='GH¢ '+total.toFixed(2); max.textContent='Outstanding: GH¢ '+total.toFixed(2); amount.max=total.toFixed(2); summary.textContent='GH¢ '+(parseFloat(amount.value)||0).toFixed(2);
      invoiceError.classList.toggle('d-none',chosen.length>0);
      if(chosen.length===0) amount.removeAttribute('max');
      window._updatePaymentSummary=refresh;
    }
    boxes.forEach(b=>b.addEventListener('change',refresh));
    document.getElementById('paymentSelectAll')?.addEventListener('click',()=>{const should=boxes.some(b=>!b.checked);boxes.forEach(b=>b.checked=should);refresh();});
    document.getElementById('paymentFull')?.addEventListener('click',()=>{const chosen=boxes.filter(b=>b.checked);if(!chosen.length){boxes.forEach(b=>b.checked=true);refresh();} const total=boxes.filter(b=>b.checked).reduce((s,b)=>s+(parseFloat(b.dataset.balance)||0),0);amount.value=total.toFixed(2);refresh();});
    amount.addEventListener('input',refresh);
    form.addEventListener('submit',async function(e){
      e.preventDefault(); alertBox.classList.add('d-none'); const chosen=boxes.filter(b=>b.checked), value=parseFloat(amount.value)||0, total=chosen.reduce((s,b)=>s+(parseFloat(b.dataset.balance)||0),0);
      if(!chosen.length){invoiceError.classList.remove('d-none');show('Please select an invoice.');return;}
      if(value<=0){show('Enter a payment amount greater than zero.');amount.focus();return;}
      if(value>total+0.005){show('Payment cannot exceed the selected invoices outstanding balance of GH¢ '+total.toFixed(2)+'.');return;}
      if(!method.value){show('Please select a payment method.');method.focus();return;}
      const btn=document.getElementById('paymentSubmitBtn'), old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Saving...';
      try{
        const payload={invoice_ids:chosen.map(b=>b.value),amount:value.toFixed(2),method:method.value,reference_number:document.getElementById('paymentReference').value.trim(),notes:document.getElementById('paymentNotes').value.trim()}; const receiptWindow=window.open('about:blank','_blank');
        const response=await fetch(form.action,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(payload)});
        let data={}; try{data=await response.json()}catch(_){throw new Error('The server returned an invalid response.');}
        if(!response.ok || !data.success) throw new Error(data.error||'Payment could not be recorded.');
        show(data.message||'Payment recorded successfully.','success');
        if(receiptWindow && !receiptWindow.closed){ receiptWindow.location.href=data.receipt_url; } else { window.open(data.receipt_url,'_blank'); }
        setTimeout(()=>window.location.reload(),500);
      }catch(err){show(err.message||'Payment could not be recorded.');btn.disabled=false;btn.innerHTML=old;}
    });
    if(boxes.length===1){boxes[0].checked=true;}
    refresh();
  }
  init(); window.initPaymentModal=init;
})();
</script>

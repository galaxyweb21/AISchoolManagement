<!-- finance/templates/finance/fee_category_form_modal.html -->
<style>
    .btn-gold {
        background-color: var(--eduai-gold, #946B1C) !important;
        border-color: var(--eduai-gold, #946B1C) !important;
        color: #fff !important;
    }
    .btn-gold:hover {
        background-color: #7a5917 !important;
        border-color: #7a5917 !important;
        color: #fff !important;
    }
    .text-gold {
        color: var(--eduai-gold, #946B1C) !important;
    }
</style>

<form method="post"
      action="{% if mode == 'create' %}{% url action_url %}{% else %}{% url action_url category.id %}{% endif %}"
      class="category-form"
      data-mode="{{ mode }}">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control"
               value="{% if mode == 'edit' %}{{ category.name }}{% endif %}"
               placeholder="e.g., Transportation Fee" required>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Type <span class="text-danger">*</span></label>
        <select class="form-select" name="category_type" required>
            {% for key, label in type_choices %}
            <option value="{{ key }}" {% if mode == 'edit' and category.category_type == key %}selected{% endif %}>
                {{ label }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_recurring" id="is_recurring"
                       {% if mode == 'edit' and category.is_recurring %}checked{% endif %}>
                <label class="form-check-label" for="is_recurring">Recurring (Per Term)</label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_optional" id="is_optional"
                       {% if mode == 'edit' and category.is_optional %}checked{% endif %}>
                <label class="form-check-label" for="is_optional">Optional (Student opt-in)</label>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="2"
                  placeholder="Brief description of this fee category">{% if mode == 'edit' %}{{ category.description|default:'' }}{% endif %}</textarea>
    </div>

    <div class="d-flex gap-2 justify-content-end border-top pt-3">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-gold">
            <i class="bi {% if mode == 'create' %}bi-check2-circle{% else %}bi-pencil-square{% endif %} me-1"></i>
            {% if mode == 'create' %}Create Category{% else %}Save Changes{% endif %}
        </button>
    </div>
</form>

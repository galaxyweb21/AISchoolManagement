<!-- ============================================================
     NAVBAR — EduAI with Notification System
     ============================================================ -->
<style>
    .eduai-hamburger { display: none; }
    @media (max-width: 991.98px) {
        .eduai-hamburger { display: inline-flex; }
    }
    .eduai-icon-btn {
        width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--surface-border, #E7E1D3);
        background: var(--surface-bg, #fff); display: inline-flex; align-items: center; justify-content: center;
        color: var(--text-primary, #1F2A28); transition: background-color .15s ease;
        cursor: pointer; position: relative;
    }
    .eduai-icon-btn:hover { background: var(--app-bg, #F7F4EC); }
    .top-navbar h5 { color: var(--text-primary, #1F2A28); margin: 0; }
    .top-navbar .dropdown-menu { background: var(--surface-bg, #fff); border-color: var(--surface-border, #E7E1D3); }
    .top-navbar .dropdown-item { color: var(--text-primary, #1F2A28); }
    .top-navbar .dropdown-item:hover { background: var(--app-bg, #F7F4EC); }
    .eduai-role-pill {
        font-size: .68rem; font-weight: 700; letter-spacing: .03em;
        color: var(--eduai-signal, #3FA796); background: var(--eduai-signal-soft, rgba(63,167,150,.16));
        padding: 2px 7px; border-radius: 5px; margin-left: 6px; vertical-align: middle;
    }
    .eduai-user-avatar {
        width: 34px; height: 34px; border-radius: 9px;
        background: linear-gradient(135deg, var(--primary-color), var(--eduai-gold-deep, #7A5817));
        color: #fff; font-weight: 800; font-size: .78rem;
        display: inline-flex; align-items: center; justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
    }
    .eduai-user-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .vr {
        width: 1px;
        height: 30px;
        background-color: var(--surface-border, #E7E1D3);
        opacity: 1;
    }
    /* Notification Styles */
    .notification-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        font-size: 0.55rem;
        padding: 0.2rem 0.4rem;
        min-width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #dc3545;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        border: 2px solid var(--surface-bg, #fff);
    }
    .notification-dropdown {
        min-width: 380px;
        max-width: 420px;
        max-height: 480px;
        overflow-y: auto;
        padding: 0;
    }
    .notification-dropdown .dropdown-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--surface-border, #E7E1D3);
        background: var(--surface-bg, #fff);
        border-radius: 8px 8px 0 0;
        position: sticky;
        top: 0;
        z-index: 1;
    }
    .notification-item {
        padding: 10px 16px;
        border-bottom: 1px solid var(--surface-border, #E7E1D3);
        transition: background 0.15s ease;
        cursor: pointer;
    }
    .notification-item:hover {
        background: var(--app-bg, #F7F4EC);
    }
    .notification-item.unread {
        background: rgba(13, 110, 253, 0.04);
        border-left: 3px solid #0d6efd;
    }
    .notification-item .notif-title {
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-primary, #1F2A28);
    }
    .notification-item .notif-message {
        font-size: 0.78rem;
        color: var(--text-muted, #6B7570);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .notification-item .notif-time {
        font-size: 0.65rem;
        color: var(--text-muted, #6B7570);
    }
    .notification-item .notif-category {
        font-size: 0.6rem;
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }
    .notification-empty {
        padding: 30px 20px;
        text-align: center;
        color: var(--text-muted, #6B7570);
    }
    .notification-empty i {
        font-size: 2rem;
        display: block;
        margin-bottom: 0.5rem;
        opacity: 0.5;
    }
    /* Notification auto-refresh pulse */
    @keyframes notif-pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
    }
    .notif-refreshing .notification-badge {
        animation: notif-pulse 0.8s ease-in-out 2;
    }
    /* Scrollbar for notification dropdown */
    .notification-dropdown::-webkit-scrollbar {
        width: 4px;
    }
    .notification-dropdown::-webkit-scrollbar-track {
        background: transparent;
    }
    .notification-dropdown::-webkit-scrollbar-thumb {
        background-color: var(--surface-border, #E7E1D3);
        border-radius: 10px;
    }

    /* Fix for collapse/sidebar toggle */
    .navbar-collapse-btn {
        cursor: pointer;
    }

    /* Ensure the hamburger button is visible and clickable */
    .eduai-hamburger {
        display: none;
    }
    @media (max-width: 991.98px) {
        .eduai-hamburger {
            display: inline-flex !important;
        }
    }
</style>

<nav class="navbar top-navbar px-4 d-flex justify-content-between align-items-center" style="background: var(--surface-bg); border-bottom: 1px solid var(--surface-border); min-height: 68px;">
    <div class="d-flex align-items-center gap-3">
        <button class="eduai-icon-btn eduai-hamburger navbar-collapse-btn" type="button" onclick="window.toggleMobileSidebar()" aria-label="Open menu">
            <i class="bi bi-list fs-5"></i>
        </button>
        <h5 class="fw-bold">{% block page_title %}Overview{% endblock %}</h5>
    </div>

    <div class="d-flex align-items-center gap-2">
        <!-- Theme Toggle -->
        <button class="eduai-icon-btn" type="button" onclick="window.toggleTheme()" aria-label="Toggle light and dark mode">
            <i class="bi bi-moon-stars-fill" data-theme-icon></i>
        </button>

        <!-- Notification Bell -->
        <div class="dropdown" id="notificationDropdown">
            <button class="eduai-icon-btn position-relative" type="button" data-bs-toggle="dropdown"
                    data-bs-auto-close="outside" aria-label="Notifications" id="notifBellBtn">
                <i class="bi bi-bell fs-6"></i>
                <span class="notification-badge" id="notifBadge" style="display: none;">0</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end notification-dropdown" id="notifDropdownMenu">
                <li class="dropdown-header d-flex justify-content-between align-items-center">
                    <span class="fw-bold small text-uppercase" style="color: var(--text-muted, #6B7570); letter-spacing:.05em;">
                        <i class="bi bi-bell me-1"></i> Notifications
                    </span>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-link p-0 text-decoration-none" id="markAllReadBtn" style="font-size:0.7rem;">
                            Mark all read
                        </button>
                        <a href="{% url 'communication:inbox' %}" class="btn btn-sm btn-link p-0 text-decoration-none" style="font-size:0.7rem;">
                            View all
                        </a>
                    </div>
                </li>
                <div id="notifList">
                    <!-- Notifications loaded via AJAX -->
                    <li class="notification-empty">
                        <i class="bi bi-inbox"></i>
                        <p class="mb-0">No notifications</p>
                    </li>
                </div>
            </ul>
        </div>

        <div class="vr"></div>

        <!-- User menu -->
        <div class="dropdown">
            <button class="btn d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" style="background:none; border:none;">
                <span class="eduai-user-avatar" id="navbarAvatar">
                    {% if user.profile_picture %}
                    <img src="{{ user.profile_picture.url }}" alt="{{ user.get_full_name }}">
                    {% else %}
                    {{ user.first_name|first|upper }}{{ user.last_name|first|upper }}
                    {% endif %}
                </span>
                <span class="d-none d-md-inline text-start">
                    <span class="d-block fw-semibold small" style="color: var(--text-primary, #1F2A28);">{{ user.get_full_name|default:user.username }}</span>
                    <span class="eduai-role-pill">{{ user.get_role_display }}</span>
                </span>
                <i class="bi bi-chevron-down small text-muted"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{% url 'accounts:profile' %}">
                    <i class="bi bi-person me-2"></i> Profile
                </a></li>
                <li><a class="dropdown-item" href="{% url 'accounts:profile_settings' %}">
                    <i class="bi bi-gear me-2"></i> Settings
                </a></li>
                <li><a class="dropdown-item" href="{% url 'communication:notification_preferences' %}">
                    <i class="bi bi-bell-slash me-2"></i> Notification Preferences
                </a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i> Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // ============================================================
    // NOTIFICATION SYSTEM
    // ============================================================
    const notifBellBtn = document.getElementById('notifBellBtn');
    const notifBadge = document.getElementById('notifBadge');
    const notifList = document.getElementById('notifList');
    const markAllReadBtn = document.getElementById('markAllReadBtn');
    let refreshInterval = null;
    let isLoading = false;

    function getCSRFToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]')?.value ||
               document.querySelector('input[name="csrfmiddlewaretoken"]')?.value;
    }

    function formatTime(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);

        if (minutes < 1) return 'Just now';
        if (minutes < 60) return minutes + 'm ago';
        if (hours < 24) return hours + 'h ago';
        if (days < 7) return days + 'd ago';
        return date.toLocaleDateString();
    }

    function getCategoryBadgeClass(category) {
        const map = {
            'OVERDUE_BALANCE': 'bg-danger',
            'TIMETABLE_UPDATE': 'bg-primary',
            'GRADE_RELEASE': 'bg-success',
            'ANNOUNCEMENT': 'bg-info',
            'PAYMENT_RECEIPT': 'bg-success',
            'ATTENDANCE_ALERT': 'bg-warning',
            'PROMOTION_RESULT': 'bg-primary',
            'SYSTEM_ALERT': 'bg-danger',
            'LEAVE_APPROVAL': 'bg-success',
            'STAFF_REMINDER': 'bg-info'
        };
        return map[category] || 'bg-secondary';
    }

    function loadNotifications() {
        if (isLoading) return;
        isLoading = true;

        fetch('{% url "communication:notification_list" %}', {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderNotifications(data.notifications);
                updateBadge(data.notifications);
            }
            isLoading = false;
        })
        .catch(err => {
            console.error('Failed to load notifications:', err);
            isLoading = false;
        });
    }

    function renderNotifications(notifications) {
        if (!notifications || notifications.length === 0) {
            notifList.innerHTML = `
                <li class="notification-empty">
                    <i class="bi bi-check-circle"></i>
                    <p class="mb-0">All caught up!</p>
                    <small class="text-muted">No new notifications</small>
                </li>
            `;
            return;
        }

        let html = '';
        const unreadCount = notifications.filter(n => !n.is_read).length;

        notifications.slice(0, 15).forEach(notif => {
            const isUnread = !notif.is_read;
            const categoryClass = getCategoryBadgeClass(notif.category);
            html += `
                <li class="notification-item ${isUnread ? 'unread' : ''}" data-id="${notif.id}">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1 me-2">
                            <div class="notif-title">${notif.subject}</div>
                            <div class="notif-message">${notif.message}</div>
                            <div class="d-flex gap-2 mt-1 align-items-center">
                                <span class="notif-time">${formatTime(notif.created_at)}</span>
                                <span class="badge ${categoryClass} notif-category">${notif.category}</span>
                                ${isUnread ? '<span class="badge bg-primary-subtle text-primary" style="font-size:0.55rem;">New</span>' : ''}
                            </div>
                        </div>
                        ${isUnread ? `<button class="btn btn-sm btn-link p-0 mark-read-btn" data-id="${notif.id}" title="Mark as read" style="font-size:0.7rem;"><i class="bi bi-check2-circle"></i></button>` : ''}
                    </div>
                </li>
            `;
        });

        if (notifications.length > 15) {
            html += `
                <li class="text-center py-2">
                    <a href="{% url 'communication:inbox' %}" class="text-decoration-none small">View all ${notifications.length} notifications</a>
                </li>
            `;
        }

        notifList.innerHTML = html;

        // Attach mark as read events
        document.querySelectorAll('.mark-read-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.id;
                markNotificationRead(id);
            });
        });

        // Click on notification item to mark as read and navigate
        document.querySelectorAll('.notification-item').forEach(item => {
            item.addEventListener('click', function() {
                const id = this.dataset.id;
                if (this.classList.contains('unread')) {
                    markNotificationRead(id, false);
                }
            });
        });
    }

    function updateBadge(notifications) {
        const unreadCount = notifications ? notifications.filter(n => !n.is_read).length : 0;
        if (unreadCount > 0) {
            notifBadge.textContent = unreadCount > 99 ? '99+' : unreadCount;
            notifBadge.style.display = 'flex';
        } else {
            notifBadge.style.display = 'none';
        }
    }

    function markNotificationRead(id, reload = true) {
        const url = "{% url 'communication:notification_mark_read' '00000000-0000-0000-0000-000000000000' %}".replace('00000000-0000-0000-0000-000000000000', id);
        fetch(url, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCSRFToken(),
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success && reload) {
                loadNotifications();
            }
        })
        .catch(err => console.error('Failed to mark notification as read:', err));
    }

    function markAllNotificationsRead() {
        fetch('{% url "communication:notification_mark_all_read" %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCSRFToken(),
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                loadNotifications();
            }
        })
        .catch(err => console.error('Failed to mark all notifications as read:', err));
    }

    // Mark all read button
    if (markAllReadBtn) {
        markAllReadBtn.addEventListener('click', function(e) {
            e.preventDefault();
            markAllNotificationsRead();
        });
    }

    // Load notifications when dropdown opens
    const dropdownElement = document.getElementById('notificationDropdown');
    if (dropdownElement) {
        dropdownElement.addEventListener('shown.bs.dropdown', function() {
            loadNotifications();
            // Start auto-refresh if not already running
            if (!refreshInterval) {
                refreshInterval = setInterval(loadNotifications, 30000); // Refresh every 30s
            }
        });

        dropdownElement.addEventListener('hidden.bs.dropdown', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        });
    }

    // Initial load (background)
    loadNotifications();

    // Periodic background refresh (every 60s when not open)
    setInterval(loadNotifications, 60000);
});
</script>
{% endblock %}
